syntax = "proto3";

package test;

option go_package = "PlataTest/contracts;quotespb";


service Quotes {
    rpc FetchPrice(QuoteRequest) returns (QuoteResponse);
}

message QuoteRequest {
    string URL = 1;
}
message ErrorInfo {
  int32 code = 1;
  string info = 2;
}

message QuoteResponse {
    bool success = 1;
    map<string, double> rates = 2;
    ErrorInfo error = 3;
}
